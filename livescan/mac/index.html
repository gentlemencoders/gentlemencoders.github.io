<html>
<head>
    <link rel="stylesheet" href="../../style.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>LiveScan | Fast text recognition</title>
<style>
    .imageText {
        text-align: center;
        color: #eeeeee;
    }

    iframe {
        border: 0px;
    }

    .sharpImage {
        image-rendering: auto; image-rendering: crisp-edges;image-rendering: pixelated;       
    }

    .modal {
				  display: none; /* Hidden by default */
				  position: fixed; /* Stay in place */
				  z-index: 1; /* Sit on top */
				  padding-top: 100px; /* Location of the box */
				  left: 0;
				  top: 0;
				  margin-left: auto;
				  margin-right: auto;
				  width: 100%; /* Full width */
				  height: 100%; /* Full height */
				  overflow: auto; /* Enable scroll if needed */
				  background-color: rgb(0,0,0); /* Fallback color */
				  background-color: rgba(0,0,0,0.9); /* Black w/ opacity */
			}

    /* Modal Content (image) */
    .modal-content {
        display: block;
            max-width: 1000px;
            width: 95%;
    }
    
    .modal-content, #caption {
			  -webkit-animation-name: zoom;
			  -webkit-animation-duration: 0.6s;
			  animation-name: zoom;
			  animation-duration: 0.6s;
			}


    /* The Close Button */
    .close {
        position: absolute;
        top: 15px;
        right: 35px;
        color: #f1f1f1;
        font-size: 40px;
        font-weight: bold;
        transition: 0.3s;
    }

    .close:hover,
    .close:focus {
        color: #bbb;
        text-decoration: none;
        cursor: pointer;
    }

    .navigationButtons {
				display: flex; justify-content: center;
			}

    .horiz-centered {
        position: relative;
        left: 50%;
        transform: translate(-50%, 0%);
    }

    .slideshowGroup {
				display: none;
			}

    .galleryimg:hover
    {
        cursor:pointer
    }
</style>

<script>
				
    var gCurrentSlideshowImageArray;
    var gCurrentSlideIndex;

    function showSlideAtIndex(slideIndex, imageArray)
    {
        if (slideIndex >= imageArray.length)
            slideIndex = 0;
        else if (slideIndex < 0)
            slideIndex = imageArray.length - 1;
        
        var modalImg = document.getElementById("modalImg");
        modalImg.src = imageArray[slideIndex].src;
        gCurrentSlideIndex = slideIndex;
    }

    
    function loadSlideshowForDivID(slideshowDivID, startIndex)
    {
        var i;
        var slideshowDivs = document.getElementsByClassName("slideshowGroup");
        var divCount = slideshowDivs.length;
        for (i = 0; i < divCount; i++) {
            // find the div for this slideshow
            var theID = slideshowDivs[i].id;
            if (theID == slideshowDivID)
            {
                // find the images for this slideshow div
                var slideshowDiv = slideshowDivs[i];
                var images = slideshowDiv.getElementsByTagName("img");
                for (j = 0; j < images.length; j++) {
                    var image = images[j];
                    var src = image.getAttribute("src");
                    var imgSrc = image.getAttribute("img-src");
                    if (imgSrc != null)
                        image.src = imgSrc;
                }

                gCurrentSlideshowImageArray = images;
                gCurrentSlideIndex = startIndex;
                showSlideAtIndex(startIndex, images);
            }
        }
    }


    function showModalImage(img, slideshowDivID, startIndex)
    {
        // Get the modal
        var modal = document.getElementById("myModal");
        var modalImg = document.getElementById("modalImg");
        var captionText = document.getElementById("caption");
        var span = document.getElementsByClassName("close")[0];
        
        modalImg.classList.add('fade-in');

        modal.style.display = "block";
        // captionText.innerHTML = this.alt;
        //window.scrollTo(0,0);
        loadSlideshowForDivID(slideshowDivID, startIndex);
    }

    function onload()
    {
        // Get the <span> element that closes the modal
        var modal = document.getElementById("myModal");
        var span = document.getElementsByClassName("close")[0];

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
          modal.style.display = "none";
          var modalImg = document.getElementById("modalImg");
          modalImg.src = "#";
        }
    }
</script>
</head>

<body onload="onload();">
    <script src="../../header.js?ver=1"></script>
    <div>
        <h2 style="text-align: center;">LiveScan is no longer under development and has been removed from the App Store.</h2>
    </div>
    </body>

</html>
